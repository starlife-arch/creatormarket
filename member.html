<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111018"><title>Your Market account | DateVault Market"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111018;color:#f7f4fb;font:16px system-ui,sans-serif}header,main{width:min(920px,calc(100% - 36px));margin:auto}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}a{color:#c6a6ff;text-decoration:none}button{border:1px solid #ffffff30;background:#252131;color:#fff;border-radius:24px;padding:10px 16px;cursor:pointer}main{padding:45px 0}.panel{background:#1b1924;border:1px solid #393244;border-radius:20px;padding:25px;margin-bottom:22px}p{color:#b8b1c5;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.link{display:inline-block;border:1px solid #ffffff25;border-radius:24px;padding:12px 17px}.note{font-size:13px;color:#aaa6b7}.purchase{padding:15px 0;border-top:1px solid #ffffff18}.purchase button{margin-top:8px}.media img,.media video{display:block;max-width:100%;max-height:70vh;border-radius:12px;margin-top:15px}</style></head>
<body><header><a href="/">DATEVAULT MARKET</a><button id="logout" type="button">Sign out</button></header><main><section class="panel"><h1>Your Market account</h1><p id="status">Checking your secure Market session…</p><div class="actions"><a class="link" href="/">Discover creators</a><a class="link" href="/studio.html">Creator Studio</a></div><p class="note">Market access is separate from your DateVault dating membership. Creator publishing and payouts require additional approval. 18+ verification is checked independently and is only required before accessing age-restricted creator content.</p></section><section class="panel"><h2>Your purchases and rentals</h2><div id="purchases" class="note">Loading your content…</div><div id="media" class="media"></div><p id="purchaseStatus" role="status"></p></section><section class="panel"><h2>Blocked creators</h2><div id="blocked" class="note">Loading blocked creators…</div></section></main>
<script>
const status=document.getElementById("status"),purchases=document.getElementById("purchases"),media=document.getElementById("media"),purchaseStatus=document.getElementById("purchaseStatus");
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function loadPurchases(){try{const r=await fetch("/api/market-my-entitlements",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);if(!d.entitlements.length){purchases.textContent="You have not purchased any creator content yet.";return;}purchases.innerHTML=d.entitlements.map(x=>'<article class="purchase"><strong>'+esc(x.listingTitle)+'</strong><p>Creator: @'+esc(x.creatorUsername)+' · '+esc(x.offerType)+' · '+(x.active?"Access active": "Access expired")+(x.expiresAt?" · Expires "+new Date(x.expiresAt).toLocaleString():" · Permanent access")+'</p>'+(x.active?'<button data-view="'+esc(x.listingId)+'">View content</button>':'')+'</article>').join("");}catch(e){purchases.textContent=e.message||"Could not load purchases.";}}
async function loadBlocked(){const box=document.getElementById("blocked");try{const r=await fetch("/api/market-blocks",{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);if(!d.blockedCreators.length){box.textContent="You have not blocked any creators.";return;}box.innerHTML=d.blockedCreators.map(x=>'<p>'+esc(x.displayName)+' · @'+esc(x.username)+' <button data-unblock="'+esc(x.uid)+'">Unblock</button></p>').join("");}catch(e){box.textContent=e.message||"Could not load blocked creators.";}}
document.getElementById("blocked").addEventListener("click",async e=>{const b=e.target.closest("button[data-unblock]");if(!b)return;b.disabled=true;try{const r=await fetch("/api/market-blocks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetUid:b.dataset.unblock,action:"unblock"})}),d=await r.json();if(!r.ok)throw Error(d.error);await loadBlocked();}catch(err){b.disabled=false;document.getElementById("purchaseStatus").textContent=err.message||"Could not unblock creator.";}}); 
purchases.addEventListener("click",async e=>{const b=e.target.closest("button[data-view]");if(!b)return;b.disabled=true;purchaseStatus.textContent="Checking access…";try{const r=await fetch("/api/market-media-access?listingId="+encodeURIComponent(b.dataset.view),{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);media.replaceChildren();let node;if(d.contentType.startsWith("image/")){node=document.createElement("img");node.alt="Purchased creator content";}else if(d.contentType.startsWith("video/")){node=document.createElement("video");node.controls=true;node.playsInline=true;if(!d.downloadAllowed)node.setAttribute("controlsList","nodownload");}else throw Error("Unsupported media type.");node.src=d.mediaUrl;media.appendChild(node);if(d.downloadAllowed){const a=document.createElement("a");a.href=d.mediaUrl;a.download="creator-content";a.textContent="Download content";media.appendChild(a);}purchaseStatus.textContent="Access verified. The private link expires in one minute.";}catch(err){purchaseStatus.textContent=err.message||"Unable to open content.";}finally{b.disabled=false;}});
(async()=>{try{const r=await fetch("/api/market-session",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||!d.authenticated){status.textContent="Your Market session is not active. Please sign in from DateVault.";return;}status.textContent="Your DateVault account is connected. Your Market session is active.";await Promise.all([loadPurchases(),loadBlocked()]);}catch(_){status.textContent="We could not verify your session. Please try again."}})();
document.getElementById("logout").addEventListener("click",async()=>{await fetch("/api/market-logout",{method:"POST",credentials:"same-origin"}).catch(()=>null);window.location.replace("/")});
</script></body></html>
