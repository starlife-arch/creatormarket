<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111018"><title>Your Market account | DateVault Market"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111018;color:#f7f4fb;font:16px system-ui,sans-serif}header,main{width:min(920px,calc(100% - 36px));margin:auto}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}a{color:#c6a6ff;text-decoration:none}button{border:1px solid #ffffff30;background:#252131;color:#fff;border-radius:24px;padding:10px 16px;cursor:pointer}main{padding:55px 0}.panel{background:#1b1924;border:1px solid #393244;border-radius:20px;padding:28px;max-width:680px}p{color:#b8b1c5;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.link{display:inline-block;border:1px solid #ffffff25;border-radius:24px;padding:12px 17px}.note{font-size:13px;color:#aaa6b7}</style></head>
<body><header><a href="/">DATEVAULT MARKET</a><button id="logout" type="button">Sign out</button></header><main><section class="panel"><h1>Your Market account</h1><p id="status">Checking your secure Market session…</p><div class="actions"><a class="link" href="/">Discover creators</a><a class="link" href="/studio.html">Creator application</a></div><p class="note">Market access is separate from your DateVault dating membership. Creator publishing and payouts require additional approval. 18+ verification is checked independently.</p></section></main>
<script>(async()=>{const status=document.getElementById("status");try{const r=await fetch("/api/market-session",{credentials:"same-origin",cache:"no-store"});const d=await r.json();if(!r.ok||!d.authenticated){status.textContent="Your Market session is not active. Please sign in from DateVault.";return;}status.textContent="Your DateVault account is connected. Your Market session is active.";}catch(_){status.textContent="We could not verify your session. Please try again."}})();document.getElementById("logout").addEventListener("click",async()=>{await fetch("/api/market-logout",{method:"POST",credentials:"same-origin"}).catch(()=>null);window.location.replace("/")});</script></body></html>
