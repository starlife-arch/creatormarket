<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Market Admin | DateVault</title><style>body{margin:0;background:#111018;color:#f7f4fb;font:15px system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto}header{padding:24px 0;border-bottom:1px solid #ffffff18}a{color:#c6a6ff;text-decoration:none}.app{padding:20px;margin:14px 0;background:#1b1924;border:1px solid #393244;border-radius:14px}.muted{color:#aaa6b7;line-height:1.6}button,input{padding:11px 14px;border-radius:20px;border:1px solid #ffffff30;background:#292435;color:white}button{cursor:pointer;margin:8px 8px 0 0}.approve{background:#c6a6ff;color:#20172d;border:0}.reject{border-color:#a66}</style></head><body><header class="wrap"><a href="/">DATEVAULT MARKET</a> · Admin review</header><main class="wrap"><h1>Creator applications</h1><p class="muted">Review identity and age-verification evidence in the approved verification workflow before approving a creator. This screen does not itself verify identity or age.</p><div id="list" class="muted">Loading…</div></main><script>const list=document.getElementById("list");async function load(){try{const r=await fetch("/api/market-admin-applications",{cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error);if(!d.applications.length){list.textContent="No pending applications.";return;}list.innerHTML=d.applications.map(a=>'<article class="app"><h3>'+esc(a.displayName)+' · @'+esc(a.username)+'</h3><p class="muted">'+esc(a.category)+'<br>'+esc(a.bio)+'</p><label>Review note <input id="note-'+esc(a.uid)+'" maxlength="500" placeholder="Optional decision note"></label><div><button class="approve" data-uid="'+esc(a.uid)+'" data-decision="approve">Approve creator page</button><button class="reject" data-uid="'+esc(a.uid)+'" data-decision="reject">Reject</button></div></article>').join("");}catch(e){list.textContent=e.message||"Could not load applications.";}}function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}list.addEventListener("click",async e=>{const b=e.target.closest("button[data-uid]");if(!b)return;b.disabled=true;try{const note=document.getElementById("note-"+b.dataset.uid).value;const r=await fetch("/api/market-admin-applications",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uid:b.dataset.uid,decision:b.dataset.decision,note})});const d=await r.json();if(!r.ok)throw Error(d.error);await load();}catch(err){alert(err.message||"Review failed.");b.disabled=false;}});load();</script></body></html>
