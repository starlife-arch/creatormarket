<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111018"><title>Creator | DateVault Market</title><style>body{margin:0;background:#111018;color:#f7f4fb;font:15px system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto}header{padding:24px 0;border-bottom:1px solid #ffffff18}a{color:#c6a6ff;text-decoration:none}.panel{margin:50px 0;padding:28px;border:1px solid #393244;border-radius:20px;background:#1b1924}p{color:#aaa6b7;line-height:1.7}.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#3b2e4d;color:#c6a6ff;font-size:24px;font-weight:800}button{cursor:pointer;border:1px solid #ffffff30;background:#292435;color:white;border-radius:20px;padding:9px 14px;margin:5px}button.primary{background:#c6a6ff;color:#20172d;border:0}button:disabled{opacity:.5}.media{margin:16px 0;max-width:100%;border-radius:12px}.media img,.media video{display:block;max-width:100%;max-height:75vh;border-radius:12px}</style></head><body><header class="wrap"><a href="/">DATEVAULT MARKET</a></header><main class="wrap"><section class="panel"><div class="avatar" id="avatar">C</div><h1 id="name">Creator</h1><p id="handle"></p><p id="bio">Loading creator profile…</p><p id="category"></p><div id="creatorActions"></div><div id="listings">Loading creator listings…</div><div id="media" class="media"></div><p id="feedback" role="status"></p></section></main><script>
const handle=new URLSearchParams(location.search).get("u"),name=document.getElementById("name"),bio=document.getElementById("bio"),box=document.getElementById("listings"),feedback=document.getElementById("feedback"),media=document.getElementById("media");let creatorUid="";
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function report(targetType,targetId){const reason=prompt("Please explain why you are reporting this "+targetType+" (at least 12 characters):");if(!reason)return;const r=await fetch("/api/market-reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetType,targetId,reason})}),d=await r.json();if(!r.ok)throw Error(d.error);feedback.textContent=d.message||"Report submitted.";}
async function viewContent(listingId){feedback.textContent="Checking your access…";const r=await fetch("/api/market-media-access?listingId="+encodeURIComponent(listingId),{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);media.replaceChildren();let node;if(d.contentType.startsWith("image/")){node=document.createElement("img");node.alt="Purchased creator content";}else if(d.contentType.startsWith("video/")){node=document.createElement("video");node.controls=true;node.playsInline=true;node.setAttribute("controlsList",d.downloadAllowed?"":"nodownload");}else throw Error("This media type cannot be previewed in the browser.");node.src=d.mediaUrl;media.appendChild(node);if(d.downloadAllowed){const a=document.createElement("a");a.href=d.mediaUrl;a.download="creator-content";a.textContent="Download content";a.style.display="inline-block";a.style.marginTop="12px";media.appendChild(a);}feedback.textContent="Access verified. This private media link expires in one minute.";}
(async()=>{if(!handle){bio.textContent="Creator not found.";box.textContent="";return;}document.getElementById("handle").textContent="@"+handle;try{const r=await fetch("/api/market-creator-profile?u="+encodeURIComponent(handle),{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);creatorUid=d.creator.uid;name.textContent=d.creator.displayName+(d.creator.verified?" ✓":"");bio.textContent=d.creator.bio;document.getElementById("avatar").textContent=(d.creator.displayName||handle).slice(0,1).toUpperCase();document.getElementById("category").textContent=d.creator.category;document.getElementById("creatorActions").innerHTML='<button id="blockCreator">Block creator</button><button id="reportCreator">Report creator</button>';const [lr,er]=await Promise.all([fetch("/api/market-listings?u="+encodeURIComponent(handle),{cache:"no-store"}),fetch("/api/market-my-entitlements",{cache:"no-store"})]);const ld=await lr.json(),ed=await er.json();if(!lr.ok)throw Error(ld.error);const active=new Set((er.ok?ed.entitlements:[]).filter(x=>x.active).map(x=>x.listingId));if(!ld.listings.length){box.textContent="This creator has no published listings yet.";return;}box.innerHTML=ld.listings.map(item=>'<article style="border-top:1px solid #393244;padding:18px 0"><h2>'+esc(item.title)+'</h2><p>'+esc(item.description)+'</p><div>'+item.offers.map(o=>'<button class="primary" data-listing="'+esc(item.id)+'" data-offer="'+esc(o.id)+'">'+esc(o.label)+' · '+Number(o.priceTokens)+' tokens</button>').join("")+(active.has(item.id)?'<button data-view-listing="'+esc(item.id)+'">View purchased content</button>':'')+'<button data-report-listing="'+esc(item.id)+'">Report listing</button></div></article>').join("");}catch(e){bio.textContent=e.message||"Could not load this creator.";box.textContent="";}})();
document.addEventListener("click",async e=>{const block=e.target.closest("#blockCreator"),reportCreator=e.target.closest("#reportCreator"),reportListing=e.target.closest("[data-report-listing]"),view=e.target.closest("[data-view-listing]"),buy=e.target.closest("button[data-listing]");const button=e.target.closest("button");if(!button)return;button.disabled=true;try{if(block){const r=await fetch("/api/market-blocks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetUid:creatorUid,action:"block"})}),d=await r.json();if(!r.ok)throw Error(d.error);feedback.textContent="Creator blocked. They will no longer appear in your Market discovery.";box.textContent="";}else if(reportCreator){await report("creator",creatorUid);}else if(reportListing){await report("listing",reportListing.dataset.reportListing);}else if(view){await viewContent(view.dataset.viewListing);}else if(buy){feedback.textContent="Processing purchase…";const r=await fetch("/api/market-purchase",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({listingId:buy.dataset.listing,offerId:buy.dataset.offer,idempotencyKey:crypto.randomUUID()})}),d=await r.json();if(!r.ok)throw Error(d.error);feedback.textContent="Purchase complete. Opening your content…";await viewContent(buy.dataset.listing);}}catch(err){feedback.textContent=err.message||"The action could not be completed.";}finally{button.disabled=false;}});
</script></body></html>
