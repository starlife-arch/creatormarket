const handle=new URLSearchParams(location.search).get("u"),name=document.getElementById("name"),bio=document.getElementById("bio"),box=document.getElementById("listings"),feedback=document.getElementById("feedback"),media=document.getElementById("media");let creatorUid="";
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function report(targetType,targetId){feedback.replaceChildren();const form=document.createElement("form");form.style.cssText="display:grid;gap:10px;margin-top:12px;padding:14px;border:1px solid #263b53;border-radius:12px;background:#101d2e";form.innerHTML='<strong>Report '+esc(targetType)+'</strong><label for="marketReportReason">Tell us what happened (at least 12 characters)</label><textarea id="marketReportReason" name="reason" minlength="12" maxlength="1000" required style="width:100%;min-height:90px;background:#091321;border:1px solid #263b53;border-radius:9px;color:white;padding:11px;font:inherit"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="submit">Submit report</button><button type="button" data-cancel-report style="background:#26384e;color:#e5edf6">Cancel</button></div>';feedback.appendChild(form);await new Promise((resolve,reject)=>{form.addEventListener("submit",async e=>{e.preventDefault();const submit=form.querySelector('button[type="submit"]');submit.disabled=true;try{const r=await fetch("/api/market-reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetType,targetId,reason:form.elements.reason.value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.error);feedback.textContent=d.message||"Report submitted.";resolve();}catch(error){const note=document.createElement("p");note.textContent=error.message||"Could not submit report.";form.appendChild(note);submit.disabled=false;reject(error);}});form.querySelector("[data-cancel-report]").addEventListener("click",()=>{feedback.textContent="Report cancelled.";resolve();});});}
async function viewContent(listingId){
 feedback.textContent="Checking your purchase and rental expiry…";
 const vr=await fetch("/api/market-video-playback?listingId="+encodeURIComponent(listingId),{cache:"no-store"});
 const vd=await vr.json().catch(()=>({}));
 if(vr.ok){
  if(!vd.playbackUrl)throw Error("Playback authorization did not return a video URL. Please retry.");
  media.replaceChildren();
  const node=document.createElement("video");node.controls=true;node.playsInline=true;node.preload="metadata";node.setAttribute("controlsList","nodownload noplaybackrate");node.style.cssText="width:100%;background:#000;border-radius:14px";media.appendChild(node);
  let hls=null,loadingTimer=setTimeout(()=>{if(node.readyState<2)feedback.textContent="The video is taking longer than expected to load. Check your connection and try opening it again.";},18000);
  const ready=()=>{clearTimeout(loadingTimer);feedback.textContent="Video ready. Your rental expiry is shown above.";};
  node.addEventListener("canplay",ready,{once:true});
  node.addEventListener("error",()=>{clearTimeout(loadingTimer);feedback.textContent="The video could not be decoded or loaded. Please retry; your purchase has not been lost.";});
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:false,xhrSetup:(xhr,url)=>{if(new URL(url,location.href).origin===location.origin)xhr.withCredentials=true;}});
    hls.on(Hls.Events.ERROR,(_event,data)=>{
      if(!data.fatal)return;
      clearTimeout(loadingTimer);
      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){feedback.textContent="Video stream connection failed. Retrying the stream…";hls.startLoad();return;}
      if(data.type===Hls.ErrorTypes.MEDIA_ERROR){feedback.textContent="Recovering the video stream…";hls.recoverMediaError();return;}

      hls.destroy();
    });
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{feedback.textContent="Video stream authorized. Press play to watch.";});
    hls.loadSource(vd.playbackUrl);hls.attachMedia(node);node._marketHls=hls;
  } else if(node.canPlayType("application/vnd.apple.mpegurl"))node.src=vd.playbackUrl;
  else throw Error("This browser cannot play HLS video.");
  const stop=()=>{node.pause();node.removeAttribute("src");if(node._marketHls)node._marketHls.destroy();node.load();feedback.textContent="Your rental has expired. Purchase another access offer to watch again.";};
  const expiresAt=new Date(vd.expiresAt).getTime();const armExpiry=()=>{const remaining=expiresAt-Date.now();if(remaining<=0)stop();else node._expiryTimer=setTimeout(armExpiry,Math.min(remaining,2147483647));};armExpiry();
  if(vd.downloadAllowed&&vd.downloadUrl){const link=document.createElement("a");link.href=vd.downloadUrl;link.download="creator-content.mp4";link.textContent="Download video";link.style.cssText="display:inline-block;margin-top:12px;color:#38d9a9";media.appendChild(link);}
  feedback.textContent="Access granted. Playback stops when your rental expires.";return;
 }
 const r=await fetch("/api/market-media-access?listingId="+encodeURIComponent(listingId),{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(vd.error||d.error);
 media.replaceChildren();let node;if(d.contentType.startsWith("image/")){node=document.createElement("img");node.alt="Purchased creator content";}else if(d.contentType.startsWith("video/")){node=document.createElement("video");node.controls=true;node.playsInline=true;node.setAttribute("controlsList",d.downloadAllowed?"":"nodownload");}else throw Error("This media type cannot be previewed in the browser.");
 node.src=d.mediaUrl;media.appendChild(node);if(d.downloadAllowed){const link=document.createElement("a");link.href=d.mediaUrl;link.download="creator-content";link.textContent="Download content";link.style.display="inline-block";link.style.marginTop="12px";media.appendChild(link);}feedback.textContent="Access verified. This private media link expires in one minute.";
}
(async()=>{if(!handle){bio.textContent="Creator not found.";box.textContent="";return;}document.getElementById("handle").textContent="@"+handle;try{const r=await fetch("/api/market-creator-profile?u="+encodeURIComponent(handle),{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);creatorUid=d.creator.uid;name.textContent=d.creator.displayName+(d.creator.verified?" ✓":"");bio.textContent=d.creator.bio;const avatar=document.getElementById("avatar");const initials=(d.creator.displayName||handle).slice(0,1).toUpperCase();avatar.textContent=initials;if(d.creator.avatarUrl){const avatarImage=document.createElement("img");avatarImage.src=d.creator.avatarUrl;avatarImage.alt=d.creator.displayName+" avatar";avatarImage.onerror=()=>{avatarImage.remove();avatar.textContent=initials;};avatar.replaceChildren(avatarImage);}document.getElementById("category").textContent=d.creator.category;document.getElementById("creatorActions").innerHTML='<button id="blockCreator">Block creator</button><button id="reportCreator">Report creator</button>';const [lr,er]=await Promise.all([fetch("/api/market-listings?u="+encodeURIComponent(handle),{cache:"no-store"}),fetch("/api/market-my-entitlements",{cache:"no-store"})]);const ld=await lr.json(),ed=await er.json();if(!lr.ok)throw Error(ld.error);const entitlementByListing=new Map();for(const item of (er.ok?ed.entitlements:[])){if(!entitlementByListing.has(item.listingId))entitlementByListing.set(item.listingId,item);}const active=new Set((er.ok?ed.entitlements:[]).filter(x=>x.active).map(x=>x.listingId));if(!ld.listings.length){box.textContent="This creator has no published listings yet.";return;}box.innerHTML=ld.listings.map(item=>{const access=entitlementByListing.get(item.id);const time=v=>v?new Date(v).toLocaleString():"";const remaining=access?.expiresAt?Math.max(0,new Date(access.expiresAt).getTime()-Date.now()):null;const remainingText=remaining===null?"Permanent access":remaining<=0?"Expired":remaining<3600000?Math.ceil(remaining/60000)+" minutes remaining":remaining<86400000?Math.floor(remaining/3600000)+" hours remaining":Math.floor(remaining/86400000)+" days remaining";const accessPanel=access?'<div style="margin:14px 0;padding:14px;border:1px solid #2b455b;border-radius:12px;background:#0d1928"><strong>YOUR ACCESS</strong><p style="margin:8px 0">Offer: '+esc(access.offerLabel||access.offerType||"Purchased access")+(access.priceTokens?' · '+Number(access.priceTokens).toLocaleString()+' tokens':'')+'</p><p style="margin:6px 0">Started: '+esc(time(access.startedAt)||"Recorded purchase")+'</p><p style="margin:6px 0">Expires: '+esc(time(access.expiresAt)||"No expiry — permanent access")+'</p><p style="margin:6px 0;color:'+(remaining!==null&&remaining<=0?'#ff9a9a':'#38d9a9')+'">'+esc(remainingText)+'</p></div>':'';return '<article style="border-top:1px solid #26364a;padding:18px 0"><h2>'+esc(item.title)+'</h2><p>'+esc(item.description)+'</p>'+accessPanel+'<div>'+item.offers.map(o=>'<button class="primary" data-listing="'+esc(item.id)+'" data-offer="'+esc(o.id)+'">'+esc(o.label)+' · '+Number(o.priceTokens)+' tokens</button>').join("")+(active.has(item.id)?'<button data-view-listing="'+esc(item.id)+'">Play purchased content</button>':'')+'<button data-report-listing="'+esc(item.id)+'">Report listing</button></div></article>';}).join("");
 for(const item of ld.listings.filter(x=>x.hasVideo)){
  const article=Array.from(box.querySelectorAll("article")).find(el=>el.querySelector("[data-listing]")?.dataset.listing===item.id);
  if(!article)continue;
  const frame=document.createElement("div");frame.className="video-preview";frame.style.cssText="position:relative;aspect-ratio:16/9;background:#05080d;border-radius:14px;overflow:hidden;margin:14px 0";
  const preview=await fetch("/api/market-video-playback?preview=1&listingId="+encodeURIComponent(item.id),{cache:"no-store"}).then(r=>r.json()).catch(()=>({}));
  const placeholder=document.createElement("div");placeholder.textContent="Video preview";placeholder.style.cssText="position:absolute;inset:0;display:grid;place-items:center;color:#8da0b5;font-weight:700;background:linear-gradient(135deg,#142338,#05080d)";frame.appendChild(placeholder);
  if(preview.playbackUrl){const img=document.createElement("img");img.src=preview.playbackUrl;img.alt="Video thumbnail for "+item.title;img.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover";img.onerror=()=>{img.remove();placeholder.textContent="Preview unavailable";};frame.appendChild(img);}else{placeholder.textContent="Preview unavailable";}
  const lock=document.createElement("button");lock.type="button";lock.dataset.previewPlay=item.id;lock.textContent="▶  Full video · Unlock to watch";lock.style.cssText="position:absolute;inset:0;display:grid;place-items:center;background:#0005;color:white;font-weight:800;text-shadow:0 1px 4px #000";
  frame.appendChild(lock);article.insertBefore(frame,article.querySelector("div"));
 }
}catch(e){bio.textContent=e.message||"Could not load this creator.";box.textContent="";}})();
document.addEventListener("click",async e=>{const block=e.target.closest("#blockCreator"),reportCreator=e.target.closest("#reportCreator"),reportListing=e.target.closest("[data-report-listing]"),view=e.target.closest("[data-view-listing]"),buy=e.target.closest("button[data-listing]"),preview=e.target.closest("[data-preview-play]");const button=e.target.closest("button");if(!button)return;button.disabled=true;try{if(preview){feedback.textContent="This video is locked. Review the creator’s description and choose an access offer below to unlock playback.";}else if(block){const r=await fetch("/api/market-blocks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetUid:creatorUid,action:"block"})}),d=await r.json();if(!r.ok)throw Error(d.error);feedback.textContent="Creator blocked. They will no longer appear in your Market discovery.";box.textContent="";}else if(reportCreator){await report("creator",creatorUid);}else if(reportListing){await report("listing",reportListing.dataset.reportListing);}else if(view){await viewContent(view.dataset.viewListing);}else if(buy){feedback.textContent="Processing purchase…";const r=await fetch("/api/market-purchase",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({listingId:buy.dataset.listing,offerId:buy.dataset.offer,idempotencyKey:crypto.randomUUID()})}),d=await r.json();if(!r.ok)throw Error(d.error);feedback.textContent="Purchase complete. Opening your content…";await viewContent(buy.dataset.listing);}}catch(err){feedback.textContent=err.message||"The action could not be completed.";}finally{button.disabled=false;}});
