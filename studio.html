<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1220"><title>Creator Studio | DateVault Market"><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--muted:#94a3b8;--text:#f8fafc;--accent:#38d9a9;--line:#26364a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.wrap{width:min(800px,calc(100% - 32px));margin:auto}header{height:72px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between}a{color:var(--accent);text-decoration:none}.brand{font-weight:800;letter-spacing:.5px}.panel{margin:35px 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}h1{margin:0 0 10px;font-size:30px}h2{font-size:20px}p{color:var(--muted);line-height:1.65}.field{display:block;margin:16px 0}.field span{display:block;font-size:13px;margin-bottom:8px;color:#dce8f2}input,textarea,select{width:100%;background:#0b1220;border:1px solid #34465d;color:white;border-radius:10px;padding:12px;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:24px;background:var(--accent);color:#071b19;padding:12px 19px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{padding:13px;border:1px solid #ffffff20;border-radius:12px;color:#dce8f2;margin:14px 0}.small{font-size:12px}.listing{padding:15px;border:1px solid #ffffff20;border-radius:12px;margin:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:var(--muted)}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><header class="wrap"><a class="brand" href="/">DATEVAULT MARKET</a><a href="/member">My Market</a></header><main class="wrap"><section class="panel"><h1>Creator Studio</h1><p>Apply to publish and earn on Creator Market. Browsing and buying are separate from creator publishing. Creator pages are reviewed before going live.</p><div id="state" class="notice">Checking your account…</div>
<section id="verifyAge" class="notice" hidden><h2>Verify your age (18+)</h2><p>Creator Market requires an age review before you can access age-restricted content. Submit a government identity document image and a recent selfie through our private upload flow. Creator identity approval remains separate.</p><p id="ageStatus" role="status">Your age verification has not been completed.</p><button id="startAgeCheck" type="button">Submit age verification evidence</button> <button id="refreshAgeCheck" type="button">Check verification status</button></section>
<form id="application" hidden><label class="field"><span>Username (unique handle)</span><input name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" placeholder="yourname" required><small class="small">3–30 letters, numbers or underscores. Handles are reserved after approval.</small></label><label class="field"><span>Public display name</span><input name="displayName" maxlength="60" required></label><label class="field"><span>Creator category</span><select name="category"><option>Adult Content</option><option>Mature Content</option><option>Explicit Content</option></select></label><label class="field"><span>About your creator page</span><textarea name="bio" minlength="20" maxlength="500" required placeholder="Tell members what kind of content you create…"></textarea></label><div class="notice">Creator publishing requires separate 18+ and identity verification, followed by admin approval.</div><button id="submit" type="submit">Submit application</button></form></section>
<section id="creatorTools" class="panel" hidden><h2>Your creator listings</h2><p>Set your access pricing. New listings remain drafts until private media storage is configured and the media is uploaded securely.</p><div id="listings" class="notice">Loading listings…</div><h2>Create a listing draft</h2><form id="listingForm"><label class="field"><span>Content title</span><input name="title" maxlength="90" required></label><label class="field"><span>Description</span><textarea name="description" minlength="20" maxlength="1200" required></textarea></label><div class="row"><label class="field"><span>Access offer</span><select name="type"><option value="timed">Timed viewing</option><option value="rental">Rental</option><option value="permanent">Permanent purchase</option></select></label><label class="field" id="unitField"><span>Duration unit</span><select name="unit"><option value="hour">Hour</option><option value="minute">Minute</option><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option></select></label></div><div class="row"><label class="field" id="valueField"><span>Duration value</span><input name="value" type="number" min="1" max="365" value="1"></label><label class="field"><span>Price (tokens)</span><input name="priceTokens" type="number" min="1" step="1" required></label></div><label class="field"><span><input name="downloadAllowed" type="checkbox" style="width:auto"> Allow downloads after purchase (off by default)</span></label><button id="saveListing" type="submit">Save listing draft</button></form>
<hr style="border:0;border-top:1px solid #26364a;margin:28px 0">
<h2>Creator earnings</h2><div id="earnings" class="notice">Loading earnings…</div>
<form id="withdrawForm"><div class="row"><label class="field"><span>Withdraw tokens (minimum 3,000)</span><input name="amountTokens" type="number" min="3000" step="1" required></label><label class="field"><span>Payout method</span><select name="method"><option>M-Pesa</option><option>Bank</option><option>PayPal</option></select></label></div><label class="field"><span>Payout details</span><input name="details" maxlength="300" required placeholder="Enter the account details for your selected method"></label><button id="withdrawButton" type="submit">Request withdrawal</button></form>
<div id="withdrawals" class="notice">Loading withdrawal history…</div></section>
</main>
<script>
const state=document.getElementById("state"),form=document.getElementById("application"),submit=document.getElementById("submit"),tools=document.getElementById("creatorTools"),listingForm=document.getElementById("listingForm"),listings=document.getElementById("listings"),verifyAge=document.getElementById("verifyAge"),ageStatus=document.getElementById("ageStatus");
async function refreshAgeStatus(){const r=await fetch("/api/market-age-verification",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);ageStatus.textContent=d.message||("Verification status: "+d.status);return d;}
document.getElementById("startAgeCheck").addEventListener("click",async()=>{const b=document.getElementById("startAgeCheck");b.disabled=true;b.textContent="Preparing secure check…";try{const r=await fetch("/api/market-age-verification",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"}),d=await r.json();if(!r.ok)throw Error(d.error);if(!d.verificationUrl)throw Error(d.message||"Could not start verification.");window.location.assign(d.verificationUrl);}catch(e){ageStatus.textContent=e.message||"Could not start age verification.";}finally{b.disabled=false;b.textContent="Start secure 18+ verification";}});
document.getElementById("refreshAgeCheck").addEventListener("click",async()=>{const b=document.getElementById("refreshAgeCheck");b.disabled=true;try{const d=await refreshAgeStatus();if(d.verified)await load();}catch(e){ageStatus.textContent=e.message||"Could not check verification status.";}finally{b.disabled=false;}});
async function loadEarnings(){try{const r=await fetch("/api/market-creator-account",{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById("earnings").textContent="Available: "+d.availableTokens+" tokens · Reserved: "+d.reservedTokens+" · Lifetime earned: "+d.lifetimeEarnedTokens+" · Withdrawn: "+d.lifetimeWithdrawnTokens;document.getElementById("withdrawals").textContent=d.withdrawals.length?d.withdrawals.map(w=>w.amountTokens+" tokens · "+w.method+" · "+w.status).join("\\n"):"No withdrawals requested yet.";}catch(e){document.getElementById("earnings").textContent=e.message||"Could not load earnings.";}}
async function loadListings(){try{const r=await fetch("/api/market-listings?mine=1",{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);if(!d.listings.length){listings.textContent="You have no listings yet.";return;}listings.innerHTML=d.listings.map(x=>'<article class="listing"><strong>'+esc(x.title)+'</strong><p>'+esc(x.description)+'</p><span class="muted">Status: '+esc(x.status)+' · '+(x.offers||[]).map(o=>esc(o.label)+" — "+o.priceTokens+" tokens").join(" / ")+'</span>'+(x.status==="draft"?'<div style="margin-top:12px"><input type="file" id="media-'+esc(x.id)+'" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"><button data-upload-listing="'+esc(x.id)+'">Upload media and publish</button></div>':'<p class="small">Published and available in your creator page.</p>')+'</article>').join("");}catch(e){listings.textContent=e.message||"Could not load listings.";}}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){try{const s=await fetch("/api/market-session",{cache:"no-store"}).then(r=>r.json());if(!s.authenticated){state.textContent="Sign in through DateVault to continue.";return;}const r=await fetch("/api/market-my-application",{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);verifyAge.hidden=!!d.ageVerified;if(!d.ageVerified){try{await refreshAgeStatus();}catch(e){ageStatus.textContent=e.message||"Verification status is currently unavailable.";}}if(d.application?.status==="approved"){if(!d.ageVerified||!d.identityVerified){state.textContent="Your creator application is approved. Publishing is locked until both 18+ verification and creator identity verification are complete. Age check: "+(d.ageVerified?"complete":"required")+". Creator identity: "+(d.identityVerified?"verified":"not yet verified")+". Didit currently completes the 18+ check; creator identity approval is separate.";form.hidden=true;return;}state.textContent="Creator application approved and both verification checks are complete. Welcome to Creator Studio.";tools.hidden=false;await Promise.all([loadListings(),loadEarnings()]);return;}if(d.application?.status==="pending"){state.textContent="Your creator application is pending admin review. You can complete 18+ verification while it is reviewed.";form.hidden=true;return;}if(d.application?.status==="rejected")state.textContent="Your previous application was rejected. You may submit an updated application.";else state.textContent="Your account is eligible to apply. Submit your application now; 18+ and creator identity verification are required before publishing.";form.hidden=false;}catch(e){state.textContent=e.message||"Could not load your application.";}}
document.getElementById("withdrawForm").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("withdrawButton");b.disabled=true;b.textContent="Submitting…";try{const body=Object.fromEntries(new FormData(e.currentTarget));body.amountTokens=Number(body.amountTokens);const r=await fetch("/api/market-creator-withdrawal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);e.currentTarget.reset();await loadEarnings();state.textContent="Withdrawal request submitted for admin processing.";}catch(err){state.textContent=err.message||"Could not submit withdrawal.";}finally{b.disabled=false;b.textContent="Request withdrawal";}});
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;submit.textContent="Submitting…";try{const r=await fetch("/api/market-creator-application",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),d=await r.json();if(!r.ok)throw Error(d.error);form.hidden=true;state.textContent=d.message||"Application submitted.";}catch(e){state.textContent=e.message||"Could not submit application."}finally{submit.disabled=false;submit.textContent="Submit application";}});
const type=listingForm.elements.type,unitField=document.getElementById("unitField"),valueField=document.getElementById("valueField");type.addEventListener("change",()=>{const t=type.value;unitField.hidden=t==="permanent";valueField.hidden=t==="permanent";const unit=listingForm.elements.unit;unit.innerHTML=t==="timed"?'<option value="hour">Hour</option><option value="minute">Minute</option>':'<option value="day">Day</option><option value="week">Week</option><option value="month">Month</option>';});
document.addEventListener("click",async e=>{const b=e.target.closest("button[data-upload-listing]");if(!b)return;const id=b.dataset.uploadListing,file=document.getElementById("media-"+id)?.files?.[0];if(!file){state.textContent="Choose an image or video first.";return;}b.disabled=true;b.textContent="Preparing upload…";try{const start=await fetch("/api/market-media-upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({listingId:id,contentType:file.type,sizeBytes:file.size})}),u=await start.json();if(!start.ok)throw Error(u.error);b.textContent="Uploading…";const uploadForm=new FormData();Object.entries(u.uploadParams||{}).forEach(([key,value])=>uploadForm.append(key,String(value)));uploadForm.append("file",file);const put=await fetch(u.uploadUrl,{method:"POST",body:uploadForm});const uploaded=await put.json().catch(()=>({}));if(!put.ok||!uploaded.public_id)throw Error(uploaded.error?.message||"Cloudinary upload failed. Check the Market signed upload preset and try again.");b.textContent="Verifying…";const done=await fetch("/api/market-media-complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({listingId:id,uploadId:u.uploadId})}),d=await done.json();if(!done.ok)throw Error(d.error);state.textContent=d.message||"Listing published.";await loadListings();}catch(err){state.textContent=err.message||"Upload failed.";}finally{b.disabled=false;b.textContent="Upload media and publish";}});
listingForm.addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("saveListing");b.disabled=true;b.textContent="Saving…";try{const f=Object.fromEntries(new FormData(listingForm));const offer={type:f.type,priceTokens:Number(f.priceTokens),label:f.type==="timed"?"Timed viewing":f.type==="rental"?"Rental":"Permanent access"};if(f.type!=="permanent"){offer.unit=f.unit;offer.value=Number(f.value);}const r=await fetch("/api/market-listings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:f.title,description:f.description,offers:[offer],downloadAllowed:listingForm.elements.downloadAllowed.checked})}),d=await r.json();if(!r.ok)throw Error(d.error);listingForm.reset();await loadListings();state.textContent=d.message;}catch(e){state.textContent=e.message||"Could not save listing."}finally{b.disabled=false;b.textContent="Save listing draft";}});
load();
</script></body></html>
