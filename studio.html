<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111018"><title>Creator Studio | DateVault Market"><style>
:root{color-scheme:dark;--bg:#111018;--panel:#1b1924;--muted:#aaa6b7;--text:#f7f4fb;--accent:#c6a6ff;--line:#393244}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}header{height:72px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between}a{color:var(--accent);text-decoration:none}.brand{font-weight:800;letter-spacing:.5px}.panel{margin:44px 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}h1{margin:0 0 10px;font-size:30px}p{color:var(--muted);line-height:1.65}.field{display:block;margin:18px 0}.field span{display:block;font-size:13px;margin-bottom:8px;color:#ddd6e8}input,textarea,select{width:100%;background:#111018;border:1px solid #494255;color:white;border-radius:10px;padding:13px;font:inherit}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:24px;background:var(--accent);color:#20172d;padding:13px 20px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{padding:13px;border:1px solid #ffffff20;border-radius:12px;color:#ddd6e8;margin:16px 0}.status{font-weight:700}.small{font-size:12px}</style></head>
<body><header class="wrap"><a class="brand" href="/">DATEVAULT MARKET</a><a href="/member.html">My Market</a></header><main class="wrap"><section class="panel"><h1>Creator application</h1><p>Apply to publish and earn on Creator Market. Browsing and buying are separate from creator publishing. Applications are reviewed before a creator page can go live.</p><div id="state" class="notice">Checking your account…</div>
<form id="application" hidden><label class="field"><span>Username (unique handle)</span><input name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" placeholder="yourname" required><small class="small">3–30 letters, numbers or underscores. Handles are reserved after approval.</small></label><label class="field"><span>Public display name</span><input name="displayName" maxlength="60" required></label><label class="field"><span>Creator category</span><select name="category"><option>Art & design</option><option>Photography</option><option>Fitness</option><option>Education</option><option>Music</option><option>Writing</option><option>Entertainment</option><option>Other</option></select></label><label class="field"><span>About your creator page</span><textarea name="bio" minlength="20" maxlength="500" required placeholder="Tell members what kind of content you create…"></textarea></label><div class="notice">Creator publishing requires independent 18+ verification and admin approval. Do not upload private media until your creator account and secure media storage are enabled.</div><button id="submit" type="submit">Submit application</button></form></section></main>
<script>
const state=document.getElementById("state"),form=document.getElementById("application"),submit=document.getElementById("submit");
async function load(){try{const s=await fetch("/api/market-session",{cache:"no-store"});const session=await s.json();if(!session.authenticated){state.textContent="Sign in through DateVault to continue.";return;}const r=await fetch("/api/market-my-application",{cache:"no-store"});const d=await r.json();if(r.status===403){state.textContent=d.error||"18+ verification is required before applying.";return;}if(!r.ok)throw Error(d.error);if(d.application){state.innerHTML="Application status: <span class='status'></span>";state.querySelector("span").textContent=d.application.status.toUpperCase();if(d.application.status==="rejected")state.textContent+=" — You may submit a revised application.";else return;}form.hidden=false;state.textContent="Your account is eligible to apply. Complete the form below.";}catch(e){state.textContent=e.message||"Could not load your application."}}
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;submit.textContent="Submitting…";try{const body=Object.fromEntries(new FormData(form));const r=await fetch("/api/market-creator-application",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);form.hidden=true;state.textContent=d.message||"Application submitted."; }catch(e){state.textContent=e.message||"Could not submit application."}finally{submit.disabled=false;submit.textContent="Submit application";}});
load();
</script></body></html>
